name: Build mAI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: mai-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run electron:compile

  version:
    name: Lire la version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: v${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: package
        name: Lire la version depuis package.json
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  desktop:
    name: Bureau — ${{ matrix.name }}
    needs: [quality, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-
      - name: Installer les dépendances
        run: npm ci
      - name: Reconstruire les modules natifs pour Electron
        run: npx electron-builder install-app-deps
      - name: Compiler et empaqueter (PR — sans publication)
        if: github.event_name == 'pull_request'
        run: npm run build:desktop -- --publish never
      - name: Compiler et empaqueter (release)
        if: github.event_name != 'pull_request'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:desktop
      - name: Publier les artefacts bureau
        uses: actions/upload-artifact@v4
        with:
          name: mAI-desktop-${{ matrix.name }}-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error
          retention-days: 14

  mobile:
    name: Mobile — ${{ matrix.name }}
    needs: [quality, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            platform: android
          - name: iOS
            os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler le Web et synchroniser Capacitor
        run: npm run cap:sync
      - name: Compiler Android
        if: matrix.platform == 'android'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace
      - name: Compiler la véritable application iOS (appareil + simulateur)
        if: matrix.platform == 'ios'
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent \
            build-simulator/Build/Products/Debug-iphonesimulator/App.app \
            mAI-iOS-simulator.app.zip

          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          rm -rf Payload
          mkdir Payload
          cp -R build-device/Build/Products/Release-iphoneos/App.app Payload/mAI.app
          zip -qry mAI-iOS-device-unsigned.ipa Payload
          ditto -c -k --sequesterRsrc --keepParent \
            build-device/Build/Products/Release-iphoneos/App.app \
            mAI-iOS-device-unsigned.app.zip
          rm -rf Payload
      - name: Publier les artefacts Android
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: mAI-mobile-Android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Publier l’artefact iOS
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: mAI-mobile-iOS-${{ github.sha }}
          path: |
            ios/App/mAI-iOS-simulator.app.zip
            ios/App/mAI-iOS-device-unsigned.ipa
            ios/App/mAI-iOS-device-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Créer la release GitHub
    needs: [version, desktop, mobile]
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: mAI-*-*
          merge-multiple: false
      - name: Créer ou mettre à jour la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Le tag doit exister avant la création de la release.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$GITHUB_SHA"
          fi

          # download-artifact recrée un dossier par artefact ; gh ne doit recevoir que des fichiers.
          mapfile -t ASSETS < <(find release-assets -type f -print)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "Aucun fichier compilé trouvé dans release-assets" >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "mAI $VERSION" \
              --generate-notes
          fi
